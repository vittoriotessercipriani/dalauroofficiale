.btn-gold:hover{transform:translateY(-3px);box-shadow:0 18px 34px -14px rgba(197,165,90,.6)}
.btn-gold::after{content:"";position:absolute;top:0;left:-85%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .65s var(--ease)}

.btn-outline{border:1px solid rgba(245,240,232,.45);color:var(--cream);background:transparent}
